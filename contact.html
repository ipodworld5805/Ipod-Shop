<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPod Shop USA</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f9f9f9;
}

/* Header */
header {
    background-color: #004080;
    color: white;
    padding: 5px;
    display: flex;
    align-items: center;
}

header img {
    height: 60px;
    margin-right: 20px;
}

header h1 {
    margin: 0;
    font-size: 1.8em;
}

/* Navigation */
nav {
    background-color: #004080;
}

nav a {
    color: white;
    padding: 14px 20px;
    display: inline-block;
    text-decoration: none;
    font-weight: bold;
}

nav a:hover {
    background-color: #002244;
}

/* Main Content */
main {
    flex-grow: 1;
    padding: 50px;
}

/* Services */
.services {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}

.service {
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 15px;
    width: 300px;
    text-align: center;
    background-color: white;
}

.service h3 {
    margin-bottom: 10px;
    color: #004080;
}

/* Contact */
.contact {
    background-color: #f2f2f2;
    padding: 30px 40px;
    border-radius: 5px;
    margin: 40px auto;
    max-width: 600px;
    text-align: center;
    border: 2px solid #004080;
}

.contact button {
    background-color: #004080;
    color: white;
    padding: 15px 30px;
    border: none;
    border-radius: 5px;
    font-size: 1.2em;
    cursor: pointer;
}

.contact button:hover {
    background-color: #002244;
}

/* Footer */
footer {
    background-color: #004080;
    color: white;
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<header>
    <img src="ipod8bitlogo.png" alt="iPod Shop USA 8-bit logo">
    <h1>iPod Shop USA</h1>
</header>

<nav>
    <a href="/index.html">Home</a>
    <a href="/shop.html">Shop</a>
    <a href="/repair.html">Repair</a>
    <a href="/update.html">Update</a>
    <a href="/contact.html">Support</a>
</nav>

<main>

<section id="contact" class="contact">
    <h2>Please Email: ipodworld580@gmail.com </h2>
    <h2>for repair inquiries and support</h2>
</section>


</main>

<footer>
    <p>&copy; 2026 iPod-Shop.com. All rights reserved.</p>
</footer>

</body>
</html>
